name: Validate Homebridge Docker Container
run-name: Validate Homebridge Docker Container - ${{ inputs.image || inputs.release_tag }}

# Tests one image on amd64 and on arm64.
# - Stage 2 calls this for the candidate image, before anything is published.
# - It can also be run by hand for an image that is already public.

on:
  workflow_call:
    inputs:
      image:
        description: 'Full name of the image to test (for example ghcr.io/homebridge/homebridge@sha256:...)'
        required: true
        type: string
      previous_image:
        description: 'An older image of the same stream. The update test starts from it. Skipped when empty or not found.'
        required: false
        type: string
        default: ''

  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published image tag to validate'
        required: true
        type: choice
        options:
          - latest
          - beta
          - alpha
          - legacy
          - synology
        default: latest

# No job gets a token with rights by default. Each job below lists what it needs.
permissions: {}

jobs:
  validate-container:
    name: Validate on ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # needed when the image is in a private ghcr.io space (a fork)
    - name: Log into GitHub Container Registry
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Pull the image
      id: image
      env:
        IMAGE_INPUT: ${{ inputs.image }}
        RELEASE_TAG: ${{ inputs.release_tag }}
        PREVIOUS_INPUT: ${{ inputs.previous_image }}
      run: |
        if [[ -n "$IMAGE_INPUT" ]]; then
          IMAGE="$IMAGE_INPUT"
        else
          IMAGE="ghcr.io/homebridge/homebridge:${RELEASE_TAG:-latest}"
        fi
        docker pull "$IMAGE"

        PREVIOUS=""
        if [[ -n "$PREVIOUS_INPUT" ]]; then
          if docker pull "$PREVIOUS_INPUT"; then
            PREVIOUS="$PREVIOUS_INPUT"
          else
            echo "::warning::Could not pull ${PREVIOUS_INPUT}. The update test is skipped."
          fi
        fi

        echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
        echo "previous=${PREVIOUS}" >> "$GITHUB_OUTPUT"

    # New volume, existing volume with a plugin, a broken package.json, a wrong
    # mount path, a failed start, the update rules and the update from the
    # previous image. See test/container/run.sh.
    - name: Container tests
      env:
        IMAGE: ${{ steps.image.outputs.image }}
        PREVIOUS_IMAGE: ${{ steps.image.outputs.previous }}
      run: test/container/run.sh "$IMAGE"

    # The way the README tells users to run it: Docker Compose and host networking
    - name: Start with Docker Compose and wait for "healthy"
      working-directory: ./test
      env:
        HOMEBRIDGE_IMAGE: ${{ steps.image.outputs.image }}
      run: |
        docker compose up -d
        CONTAINER=$(docker compose ps -q homebridge)

        # the real health state of the container, not only the word "Up"
        for attempt in $(seq 1 60); do
          STATE=$(docker inspect -f '{{.State.Status}}' "$CONTAINER")
          HEALTH=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$CONTAINER")
          echo "attempt ${attempt}: container ${STATE}, health ${HEALTH}"
          if [[ "$STATE" != "running" ]]; then
            echo "::error::The container is not running (${STATE})"
            exit 1
          fi
          if [[ "$HEALTH" == "healthy" ]]; then
            break
          fi
          if [[ "$HEALTH" == "unhealthy" || "$HEALTH" == "none" ]]; then
            echo "::error::Container health is ${HEALTH}"
            exit 1
          fi
          sleep 5
        done
        if [[ "$HEALTH" != "healthy" ]]; then
          echo "::error::The container did not become healthy in 5 minutes"
          exit 1
        fi

    - name: Check the Homebridge UI, the service and the manifest
      working-directory: ./test
      run: |
        echo "Homebridge UI on port 8581 of the host:"
        curl --fail --silent --show-error --max-time 30 --output /dev/null http://localhost:8581

        echo "Homebridge start line in the log:"
        docker compose logs | grep "Homebridge v"

        echo "hb-service status inside the container:"
        docker compose exec -T homebridge hb-service status

        echo "Docker manifest:"
        docker compose exec -T homebridge cat /opt/homebridge/Docker.manifest | tee manifest_output.txt
        for name in Ubuntu "ffmpeg for homebridge" "Homebridge APT Package" NodeJS "Homebridge UI" Homebridge; do
          if ! grep -q "|${name}|[^|]\+|" manifest_output.txt; then
            echo "::error::The manifest has no version for ${name}"
            exit 1
          fi
        done
        if grep -q "|null|\||[[:space:]]*|" manifest_output.txt; then
          echo "::error::The manifest has an empty version"
          exit 1
        fi

    - name: Show the container log
      if: failure()
      working-directory: ./test
      run: docker compose logs --tail 200 || true

    - name: Cleanup
      if: always()
      working-directory: ./test
      run: docker compose down --volumes || true
