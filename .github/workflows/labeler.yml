name: Labeler

on:
  pull_request_target: # required for auto labeler
    types: [opened, reopened, synchronize]
  workflow_dispatch:

# No job gets a token with rights by default. Each job below lists what it needs.
permissions: {}

jobs:
  stale:
    permissions:
      contents: read
      pull-requests: write
    uses: homebridge/.github/.github/workflows/labeler.yml@latest
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
