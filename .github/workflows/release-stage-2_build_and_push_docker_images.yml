name: Release Stage 2 - Build and Push Docker Images
run-name: Release Stage 2 - ${{ github.event.inputs.Scheduled }} - Build and Push ${{ inputs.release_type }} Docker Images

# How a release runs:
#   1. set-versions      works out the versions and stops if today's release already exists
#   2. build-candidate   builds the image once and pushes it to a test tag on ghcr.io
#                        (candidate-<version>). Nobody pulls that tag.
#   3. test-candidate    starts the candidate on amd64 and on arm64, with a new volume and
#                        with a volume from the image that is public now
#   4. publish-images    only when the tests passed: copies the tested image to the real
#                        tags on ghcr.io and Docker Hub. Nothing is built a second time.
#   5. extract-manifest, create-release, discord-notification
#
# So a broken image stops at step 3 and never reaches latest, beta, alpha, legacy or synology.

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Choose release type: stable, beta, alpha, synology or legacy.'
        required: true
        type: choice
        options:
          - stable
          - beta
          - alpha
          - legacy
          - synology
        default: beta
      Scheduled:
        description: 'Whether this is a scheduled run'
        required: false
        type: choice
        options:
          - Scheduled
          - Manual
          - Testing
        default: Manual
      replace_existing:
        description: 'Build again when a release with today''s tag already exists (the images and the release are replaced)'
        required: false
        type: boolean
        default: false

concurrency:
  group: stage-2-build-and-push
  cancel-in-progress: false

jobs:
  set-versions:
    runs-on: ubuntu-latest
    outputs:
      DOCKER_HOMEBRIDGE_VERSION: ${{ steps.versions.outputs.DOCKER_HOMEBRIDGE_VERSION }}
      HOMEBRIDGE_APT_PKG_VERSION: ${{ steps.versions.outputs.HOMEBRIDGE_APT_PKG_VERSION }}
      FFMPEG_FOR_HOMEBRIDGE_VERSION: ${{ steps.versions.outputs.FFMPEG_FOR_HOMEBRIDGE_VERSION }}
      BASE_IMAGE: ${{ steps.versions.outputs.BASE_IMAGE }}
      PLATFORMS: ${{ steps.versions.outputs.PLATFORMS }}
      RELEASE_TITLE: ${{ steps.versions.outputs.RELEASE_TITLE }}
      DOCKER_TAG: ${{ steps.versions.outputs.DOCKER_TAG }}
      IS_STABLE: ${{ steps.versions.outputs.IS_STABLE }}
      GHCR_IMAGE: ${{ steps.versions.outputs.GHCR_IMAGE }}
      CANDIDATE_IMAGE: ${{ steps.versions.outputs.CANDIDATE_IMAGE }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set Versions
      id: versions
      env:
        RELEASE_TYPE: ${{ inputs.release_type }}
        REPOSITORY_OWNER: ${{ github.repository_owner }}
      run: |
        DATE_TAG="$(date +%Y-%m-%d)"

        # Only beta and alpha may build from a pre-release branch (e.g. beta-2026.11.18).
        # Everything else must come from latest, so a branch can never publish :latest,
        # :ubuntu, :legacy or :synology.
        if [[ "$RELEASE_TYPE" != "beta" && "$RELEASE_TYPE" != "alpha" && "$GITHUB_REF_NAME" != "latest" ]]; then
          echo "::error::${RELEASE_TYPE} releases must be built from the latest branch, not ${GITHUB_REF_NAME}"
          exit 1
        fi
        if [[ "$GITHUB_REF_NAME" != "latest" && ! "$GITHUB_REF_NAME" =~ ^${RELEASE_TYPE}-[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
          echo "::error::${RELEASE_TYPE} releases must be built from latest or a ${RELEASE_TYPE}-YYYY.M.D branch, not ${GITHUB_REF_NAME}"
          exit 1
        fi

        if [[ "$RELEASE_TYPE" == "stable" ]]; then
          PKG_FILE="package.json"
          DOCKER_TAG="latest"
          DOCKER_HOMEBRIDGE_VERSION="${DATE_TAG}"
          RELEASE_TITLE="Homebridge Docker Release ${DATE_TAG}"
          IS_STABLE="true"
        else
          PKG_FILE="${RELEASE_TYPE}/package.json"
          DOCKER_TAG="${RELEASE_TYPE}"
          DOCKER_HOMEBRIDGE_VERSION="${RELEASE_TYPE}-${DATE_TAG}"
          RELEASE_TITLE="${RELEASE_TYPE^^}: Homebridge Docker Release ${RELEASE_TYPE}-${DATE_TAG}"
          IS_STABLE="false"
        fi

        if [[ ! -f "$PKG_FILE" ]]; then
          echo "Error: $PKG_FILE not found for release type '$RELEASE_TYPE'"
          exit 1
        fi

        HOMEBRIDGE_APT_PKG_VERSION=$(jq -r '.dependencies["@homebridge/homebridge-apt-pkg"]' "$PKG_FILE" | sed 's/\^//')
        FFMPEG_FOR_HOMEBRIDGE_VERSION=$(jq -r '.dependencies["ffmpeg-for-homebridge"]' "$PKG_FILE" | sed 's/\^//')
        BASE_IMAGE=$(jq -r '.docker.baseImage // "ubuntu:24.04"' "$PKG_FILE" | sed 's/\^//')

        # Keep ARMv7 while using Ubuntu 24.04; drop it for Ubuntu 26.04.
        if [[ "$BASE_IMAGE" =~ (^|/)ubuntu:26\.04(@.*)?$ ]]; then
          PLATFORMS="linux/amd64,linux/arm64"
        else
          PLATFORMS="linux/amd64,linux/arm/v7,linux/arm64"
        fi

        # On a fork the images go to the fork owner's ghcr.io space
        GHCR_IMAGE="ghcr.io/${REPOSITORY_OWNER,,}/homebridge"

        {
          echo "DOCKER_HOMEBRIDGE_VERSION=${DOCKER_HOMEBRIDGE_VERSION}"
          echo "DOCKER_TAG=${DOCKER_TAG}"
          echo "RELEASE_TITLE=${RELEASE_TITLE}"
          echo "IS_STABLE=${IS_STABLE}"
          echo "HOMEBRIDGE_APT_PKG_VERSION=v${HOMEBRIDGE_APT_PKG_VERSION}"
          echo "FFMPEG_FOR_HOMEBRIDGE_VERSION=v${FFMPEG_FOR_HOMEBRIDGE_VERSION}"
          echo "BASE_IMAGE=${BASE_IMAGE}"
          echo "PLATFORMS=${PLATFORMS}"
          echo "GHCR_IMAGE=${GHCR_IMAGE}"
          echo "CANDIDATE_IMAGE=${GHCR_IMAGE}:candidate-${DOCKER_HOMEBRIDGE_VERSION}"
        } >> "$GITHUB_OUTPUT"

    # The version is only the date. A second build on the same day would push
    # new images over the tags of the first one, so it has to be asked for.
    - name: Stop when this release already exists
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ steps.versions.outputs.DOCKER_HOMEBRIDGE_VERSION }}
        REPLACE_EXISTING: ${{ inputs.replace_existing }}
      run: |
        if gh release view "$RELEASE_TAG" --json tagName > /dev/null 2>&1; then
          if [[ "$REPLACE_EXISTING" == "true" ]]; then
            echo "::warning::Release ${RELEASE_TAG} already exists and will be replaced (replace_existing is on)"
          else
            echo "::error::Release ${RELEASE_TAG} already exists. A second build on the same day replaces its images. Run this workflow by hand with replace_existing ticked if that is what you want."
            exit 1
          fi
        fi

    - name: Output versions
      env:
        VERSIONS: ${{ toJSON(steps.versions.outputs) }}
      run: |
        echo "::group::Version Information"
        jq -r 'to_entries[] | "\(.key)=\(.value)"' <<< "$VERSIONS"
        echo "::endgroup::"

  build-candidate:
    name: Build the candidate image
    runs-on: ubuntu-latest
    needs: set-versions
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log into GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # One build for all CPU types. It goes to the candidate tag only.
    - name: Build and push the candidate to GHCR
      id: build
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        platforms: ${{ needs.set-versions.outputs.PLATFORMS }}
        push: true
        build-args: |
          HOMEBRIDGE_APT_PKG_VERSION=${{ needs.set-versions.outputs.HOMEBRIDGE_APT_PKG_VERSION }}
          FFMPEG_FOR_HOMEBRIDGE_VERSION=${{ needs.set-versions.outputs.FFMPEG_FOR_HOMEBRIDGE_VERSION }}
          DOCKER_HOMEBRIDGE_VERSION=${{ needs.set-versions.outputs.DOCKER_HOMEBRIDGE_VERSION }}
          DOCKER_HOMEBRIDGE_BUILD=${{ github.run_id }}.${{ github.run_attempt }}
          BASE_IMAGE=${{ needs.set-versions.outputs.BASE_IMAGE }}
        tags: ${{ needs.set-versions.outputs.CANDIDATE_IMAGE }}

    # There is no 32-bit ARM runner. The 32-bit image is at least started under
    # emulation (QEMU is set up above) to see that its programs run.
    - name: Smoke test the 32-bit ARM image
      if: contains(needs.set-versions.outputs.PLATFORMS, 'linux/arm/v7')
      env:
        CANDIDATE: ${{ needs.set-versions.outputs.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}
      run: |
        docker run --rm --platform linux/arm/v7 --entrypoint /bin/sh "$CANDIDATE" -c '
          set -e
          echo "CPU type: $(uname -m)"
          /opt/homebridge/bin/node --version
          /opt/homebridge/bin/npm --version
          jq --version
          ffmpeg -version | head -1
          cat /opt/homebridge/Docker.manifest
        '

  test-candidate:
    name: Test the candidate image
    needs: [set-versions, build-candidate]
    uses: ./.github/workflows/validate-docker-container.yml
    with:
      image: ${{ needs.set-versions.outputs.GHCR_IMAGE }}@${{ needs.build-candidate.outputs.digest }}
      # the image that users of this stream run today: the update test starts from it
      previous_image: ${{ needs.set-versions.outputs.GHCR_IMAGE }}:${{ needs.set-versions.outputs.DOCKER_TAG }}

  publish-images:
    name: Publish the tested image
    runs-on: ubuntu-latest
    needs: [set-versions, build-candidate, test-candidate]
    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log into GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Log into Docker Hub
      uses: docker/login-action@v4
      if: github.repository == 'homebridge/docker-homebridge'
      with:
        registry: docker.io
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # "imagetools create" copies the image that was tested (picked by its
    # digest) to the real tags. Both registries get exactly the same image.
    - name: Copy the tested image to the release tags
      env:
        SOURCE: ${{ needs.set-versions.outputs.GHCR_IMAGE }}@${{ needs.build-candidate.outputs.digest }}
        GHCR_IMAGE: ${{ needs.set-versions.outputs.GHCR_IMAGE }}
        DOCKER_TAG: ${{ needs.set-versions.outputs.DOCKER_TAG }}
        DOCKER_HOMEBRIDGE_VERSION: ${{ needs.set-versions.outputs.DOCKER_HOMEBRIDGE_VERSION }}
        IS_STABLE: ${{ needs.set-versions.outputs.IS_STABLE }}
        PUSH_TO_DOCKER_HUB: ${{ github.repository == 'homebridge/docker-homebridge' }}
      run: |
        TAGS=("$DOCKER_TAG" "$DOCKER_HOMEBRIDGE_VERSION")
        if [[ "$IS_STABLE" == "true" ]]; then
          TAGS+=("ubuntu")
        fi

        REPOSITORIES=("$GHCR_IMAGE")
        if [[ "$PUSH_TO_DOCKER_HUB" == "true" ]]; then
          REPOSITORIES+=("homebridge/homebridge")
        fi

        for repository in "${REPOSITORIES[@]}"; do
          TAG_ARGS=()
          for tag in "${TAGS[@]}"; do
            TAG_ARGS+=(--tag "${repository}:${tag}")
          done
          echo "::group::Publishing ${repository}: ${TAGS[*]}"
          docker buildx imagetools create "${TAG_ARGS[@]}" "$SOURCE"
          echo "::endgroup::"
        done

  extract-manifest:
    runs-on: ubuntu-latest
    needs: [set-versions, publish-images]
    outputs:
      package_changes: ${{ steps.extract_changes.outputs.package_changes }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Create Release Body
      id: release_body
      env:
        GH_TOKEN: ${{ github.token }}
        DOCKER_HOMEBRIDGE_VERSION: ${{ needs.set-versions.outputs.DOCKER_HOMEBRIDGE_VERSION }}
        RELEASE_TYPE: ${{ inputs.release_type }}
      run: |
        ./scripts/create-release-body.sh "$DOCKER_HOMEBRIDGE_VERSION" "$RELEASE_TYPE" "$GITHUB_REF_NAME"

    - name: Extract package changes for Discord
      id: extract_changes
      env:
        GH_TOKEN: ${{ github.token }}
        DOCKER_TAG: ${{ needs.set-versions.outputs.DOCKER_TAG }}
        IS_STABLE: ${{ needs.set-versions.outputs.IS_STABLE }}
      run: |
        if [[ "$IS_STABLE" == "true" ]]; then
          LATEST_RELEASE=$(gh release list --limit 50 --json tagName | jq -r '.[] | select(.tagName | test("^[0-9]{4}-")) | .tagName' | head -1)
        else
          LATEST_RELEASE=$(gh release list --limit 50 --json tagName | jq -r --arg prefix "${DOCKER_TAG}-" '.[] | select(.tagName | startswith($prefix)) | .tagName' | head -1)
        fi

        echo "Comparing with latest release: $LATEST_RELEASE"

        if [[ -n "$LATEST_RELEASE" ]]; then
          PREV_MANIFEST=$(gh release view "$LATEST_RELEASE" --json body | jq -r '.body')
          CURRENT_MANIFEST=$(cat output/Docker.manifest)

          extract_package_version() {
            echo "$1" | grep "|$2|" | awk -F'|' '{print $3}' | tr -d ' '
          }

          PACKAGE_CHANGES=""
          packages=("Ubuntu" "ffmpeg for homebridge" "Homebridge APT Package" "NodeJS" "Homebridge UI" "Homebridge")

          for package in "${packages[@]}"; do
            current_version=$(extract_package_version "$CURRENT_MANIFEST" "$package")
            prev_version=$(extract_package_version "$PREV_MANIFEST" "$package")
            if [[ "$current_version" != "$prev_version" && -n "$current_version" && -n "$prev_version" ]]; then
              [[ -n "$PACKAGE_CHANGES" ]] && PACKAGE_CHANGES="$PACKAGE_CHANGES\n"
              PACKAGE_CHANGES="${PACKAGE_CHANGES}• **$package**: $prev_version → $current_version"
            fi
          done

          [[ -z "$PACKAGE_CHANGES" ]] && PACKAGE_CHANGES="• No package version changes detected"
        else
          PACKAGE_CHANGES="• Initial release - no previous version to compare"
        fi

        {
          echo 'package_changes<<EOF'
          echo -e "$PACKAGE_CHANGES"
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"

    - name: Upload outputs as artifacts
      uses: actions/upload-artifact@v7
      with:
        name: output
        path: output/*

  create-release:
    runs-on: ubuntu-latest
    needs: [set-versions, extract-manifest]
    steps:
    - name: Create GitHub App Token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ secrets.DEPENDENCY_BOT_APP_ID }}
        private-key: ${{ secrets.DEPENDENCY_BOT_PRIVATE_KEY }}
        owner: homebridge
        repositories: docker-homebridge
        permission-contents: write
    - name: Checkout
      uses: actions/checkout@v7

    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        name: output
        path: output

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        RELEASE_TAG: ${{ needs.set-versions.outputs.DOCKER_HOMEBRIDGE_VERSION }}
        RELEASE_TITLE: ${{ needs.set-versions.outputs.RELEASE_TITLE }}
        RELEASE_TYPE: ${{ inputs.release_type }}
        IS_STABLE: ${{ needs.set-versions.outputs.IS_STABLE }}
      run: |
        # Tag the commit that was built (not the default branch head). Only a
        # stable release may become GitHub's "Latest" release.
        RELEASE_FLAGS=()
        if [[ "$IS_STABLE" == "true" ]]; then
          RELEASE_FLAGS+=(--latest)
        else
          RELEASE_FLAGS+=(--latest=false)
        fi
        if [[ "$RELEASE_TYPE" == "beta" || "$RELEASE_TYPE" == "alpha" ]]; then
          RELEASE_FLAGS+=(--prerelease)
        fi

        # set-versions only lets a build get this far with an existing release
        # when replace_existing is on
        if gh release view "$RELEASE_TAG" --json tagName > /dev/null 2>&1; then
          gh release delete "$RELEASE_TAG" --cleanup-tag --yes
        fi

        gh release create "$RELEASE_TAG" \
          --target "${GITHUB_SHA}" \
          --title "$RELEASE_TITLE" \
          --notes-file output/release-body.md \
          --draft=false \
          "${RELEASE_FLAGS[@]}"

        gh release upload "$RELEASE_TAG" "output/Docker.manifest" --clobber

        echo "::notice::Release ${RELEASE_TAG} - ${RELEASE_TITLE} created successfully."

  # Last step: people are only told once the image is tested, public and released
  discord-notification:
    name: Discord Webhooks
    needs: [set-versions, create-release, extract-manifest]
    if: ${{ inputs.release_type == 'stable' }}
    uses: homebridge/.github/.github/workflows/discord-webhooks.yml@latest
    with:
      title: "${{ needs.set-versions.outputs.RELEASE_TITLE }}"
      url: "https://github.com/homebridge/docker-homebridge/releases/tag/${{ needs.set-versions.outputs.DOCKER_HOMEBRIDGE_VERSION }}"
      description: |
        Version `${{ needs.set-versions.outputs.DOCKER_HOMEBRIDGE_VERSION }}`

        **Package Changes:**
        ${{ needs.extract-manifest.outputs.package_changes }}
    secrets:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL_LATEST }}
