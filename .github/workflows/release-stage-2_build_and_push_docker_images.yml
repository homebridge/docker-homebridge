name: Release Stage 2 - Build and Push Docker Images
run-name: Release Stage 2 - ${{ github.event.inputs.Scheduled }} - Build and Push ${{ inputs.release_type }} Docker Images

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Choose release type: stable, beta, alpha, synology or legacy.'
        required: true
        type: choice
        options:
          - stable
          - beta
          - alpha
          - legacy
          - synology
        default: beta
      Scheduled:
        description: 'Whether this is a scheduled run'
        required: false
        type: choice
        options:
          - Scheduled
          - Manual
          - Testing
        default: Manual

concurrency:
  group: stage-2-build-and-push
  cancel-in-progress: false

jobs:
  set-versions:
    runs-on: ubuntu-latest
    outputs:
      DOCKER_HOMEBRIDGE_VERSION: ${{ steps.versions.outputs.DOCKER_HOMEBRIDGE_VERSION }}
      HOMEBRIDGE_APT_PKG_VERSION: ${{ steps.versions.outputs.HOMEBRIDGE_APT_PKG_VERSION }}
      HOMEBRIDGE_APT_PKG_FILE: ${{ steps.versions.outputs.HOMEBRIDGE_APT_PKG_FILE }}
      FFMPEG_FOR_HOMEBRIDGE_VERSION: ${{ steps.versions.outputs.FFMPEG_FOR_HOMEBRIDGE_VERSION }}
      RELEASE_TITLE: ${{ steps.versions.outputs.RELEASE_TITLE }}
      DOCKER_TAG: ${{ steps.versions.outputs.DOCKER_TAG }}
      IS_STABLE: ${{ steps.versions.outputs.IS_STABLE }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set Versions
      id: versions
      run: |
        RELEASE_TYPE="${{ inputs.release_type }}"
        DATE_TAG="$(date +%Y-%m-%d)"

        if [[ "$RELEASE_TYPE" == "stable" ]]; then
          PKG_FILE="package.json"
          DOCKER_TAG="latest"
          DOCKER_HOMEBRIDGE_VERSION="${DATE_TAG}"
          RELEASE_TITLE="Homebridge Docker Release ${DATE_TAG}"
          IS_STABLE="true"
        else
          PKG_FILE="${RELEASE_TYPE}/package.json"
          DOCKER_TAG="${RELEASE_TYPE}"
          DOCKER_HOMEBRIDGE_VERSION="${RELEASE_TYPE}-${DATE_TAG}"
          RELEASE_TITLE="${RELEASE_TYPE^^}: Homebridge Docker Release ${RELEASE_TYPE}-${DATE_TAG}"
          IS_STABLE="false"
        fi

        if [[ ! -f "$PKG_FILE" ]]; then
          echo "Error: $PKG_FILE not found for release type '$RELEASE_TYPE'"
          exit 1
        fi

        HOMEBRIDGE_APT_PKG_VERSION=$(jq -r '.dependencies["@homebridge/homebridge-apt-pkg"]' "$PKG_FILE" | sed 's/\^//')
        FFMPEG_FOR_HOMEBRIDGE_VERSION=$(jq -r '.dependencies["ffmpeg-for-homebridge"]' "$PKG_FILE" | sed 's/\^//')

        # Transform apt pkg filename: X.Y.Z-prerelease.N → X.Y.Z.prerelease.N (Debian naming)
        # Stable versions (e.g. 2.0.2) pass through unchanged
        HOMEBRIDGE_APT_PKG_FILE=$(echo "$HOMEBRIDGE_APT_PKG_VERSION" | sed 's/\([0-9]*\.[0-9]*\.[0-9]*\)-\([a-zA-Z][a-zA-Z0-9]*\)\(\.[0-9]*\)/\1.\2\3/')

        {
          echo "DOCKER_HOMEBRIDGE_VERSION=${DOCKER_HOMEBRIDGE_VERSION}"
          echo "DOCKER_TAG=${DOCKER_TAG}"
          echo "RELEASE_TITLE=${RELEASE_TITLE}"
          echo "IS_STABLE=${IS_STABLE}"
          echo "HOMEBRIDGE_APT_PKG_VERSION=v${HOMEBRIDGE_APT_PKG_VERSION}"
          echo "HOMEBRIDGE_APT_PKG_FILE=v${HOMEBRIDGE_APT_PKG_FILE}"
          echo "FFMPEG_FOR_HOMEBRIDGE_VERSION=v${FFMPEG_FOR_HOMEBRIDGE_VERSION}"
        } >> $GITHUB_OUTPUT

    - name: Output versions
      run: |
        echo "::group::Version Information"
        echo "DOCKER_HOMEBRIDGE_VERSION=${{ steps.versions.outputs.DOCKER_HOMEBRIDGE_VERSION }}"
        echo "DOCKER_TAG=${{ steps.versions.outputs.DOCKER_TAG }}"
        echo "IS_STABLE=${{ steps.versions.outputs.IS_STABLE }}"
        echo "HOMEBRIDGE_APT_PKG_VERSION=${{ steps.versions.outputs.HOMEBRIDGE_APT_PKG_VERSION }}"
        echo "HOMEBRIDGE_APT_PKG_FILE=${{ steps.versions.outputs.HOMEBRIDGE_APT_PKG_FILE }}"
        echo "FFMPEG_FOR_HOMEBRIDGE_VERSION=${{ steps.versions.outputs.FFMPEG_FOR_HOMEBRIDGE_VERSION }}"
        echo "RELEASE_TITLE=${{ steps.versions.outputs.RELEASE_TITLE }}"
        echo "::endgroup::"

  build-images:
    runs-on: ubuntu-latest
    needs: set-versions
    outputs:
      docker_metadata: ${{ steps.docker_hub_build_and_push.outputs.metadata }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Set build args
      id: build_args
      run: |
        ARGS="HOMEBRIDGE_APT_PKG_VERSION=${{ needs.set-versions.outputs.HOMEBRIDGE_APT_PKG_VERSION }}
        HOMEBRIDGE_APT_PKG_FILE=${{ needs.set-versions.outputs.HOMEBRIDGE_APT_PKG_FILE }}
        FFMPEG_FOR_HOMEBRIDGE_VERSION=${{ needs.set-versions.outputs.FFMPEG_FOR_HOMEBRIDGE_VERSION }}
        DOCKER_HOMEBRIDGE_VERSION=${{ needs.set-versions.outputs.DOCKER_HOMEBRIDGE_VERSION }}"

        # If a synology release, we need to pass BASE_IMAGE=22.04 to build args
        if [[ "${{ inputs.release_type }}" == "synology" ]]; then
          ARGS="$ARGS
        BASE_IMAGE=22.04"
        fi

        echo "args<<EOF" >> $GITHUB_OUTPUT
        echo "$ARGS" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Set image tags (GHCR)
      id: ghcr_tags
      run: |
        TAGS="ghcr.io/homebridge/homebridge:${{ needs.set-versions.outputs.DOCKER_TAG }}
        ghcr.io/homebridge/homebridge:${{ needs.set-versions.outputs.DOCKER_HOMEBRIDGE_VERSION }}"
        if [[ "${{ needs.set-versions.outputs.IS_STABLE }}" == "true" ]]; then
          TAGS="$TAGS
        ghcr.io/homebridge/homebridge:ubuntu"
        fi
        echo "tags<<EOF" >> $GITHUB_OUTPUT
        echo "$TAGS" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Log into GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push to GHCR
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm/v7,linux/arm64
        push: true
        build-args: ${{ steps.build_args.outputs.args }}
        tags: ${{ steps.ghcr_tags.outputs.tags }}

    - name: Log into Docker Hub
      uses: docker/login-action@v4
      if: github.repository == 'homebridge/docker-homebridge'
      with:
        registry: docker.io
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set image tags (Docker Hub)
      id: hub_tags
      if: github.repository == 'homebridge/docker-homebridge'
      run: |
        TAGS="homebridge/homebridge:${{ needs.set-versions.outputs.DOCKER_TAG }}
        homebridge/homebridge:${{ needs.set-versions.outputs.DOCKER_HOMEBRIDGE_VERSION }}"
        if [[ "${{ needs.set-versions.outputs.IS_STABLE }}" == "true" ]]; then
          TAGS="$TAGS
        homebridge/homebridge:ubuntu"
        fi
        echo "tags<<EOF" >> $GITHUB_OUTPUT
        echo "$TAGS" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Build and Push to Docker Hub
      if: github.repository == 'homebridge/docker-homebridge'
      id: docker_hub_build_and_push
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm/v7,linux/arm64
        push: true
        build-args: ${{ steps.build_args.outputs.args }}
        tags: ${{ steps.hub_tags.outputs.tags }}

  extract-manifest:
    runs-on: ubuntu-latest
    needs: [set-versions, build-images]
    outputs:
      release_body: ${{ steps.release_body.outputs.release_body }}
      package_changes: ${{ steps.extract_changes.outputs.package_changes }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Create Release Body
      id: release_body
      run: |
        ./scripts/create-release-body.sh "${{ needs.set-versions.outputs.DOCKER_HOMEBRIDGE_VERSION }}" "${{ inputs.release_type }}"
        echo "release_body=output/release-body.md" >> $GITHUB_OUTPUT
        echo "docker_manifest=output/Docker.manifest" >> $GITHUB_OUTPUT
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Extract package changes for Discord
      id: extract_changes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        DOCKER_TAG="${{ needs.set-versions.outputs.DOCKER_TAG }}"

        if [[ "${{ needs.set-versions.outputs.IS_STABLE }}" == "true" ]]; then
          LATEST_RELEASE=$(gh release list --limit 50 --json tagName | jq -r '.[] | select(.tagName | test("^[0-9]{4}-")) | .tagName' | head -1)
        else
          LATEST_RELEASE=$(gh release list --limit 50 --json tagName | jq -r --arg prefix "${DOCKER_TAG}-" '.[] | select(.tagName | startswith($prefix)) | .tagName' | head -1)
        fi

        echo "Comparing with latest release: $LATEST_RELEASE"

        if [[ -n "$LATEST_RELEASE" ]]; then
          PREV_MANIFEST=$(gh release view "$LATEST_RELEASE" --json body | jq -r '.body')
          CURRENT_MANIFEST=$(cat ${{ steps.release_body.outputs.docker_manifest }})

          extract_package_version() {
            echo "$1" | grep "|$2|" | awk -F'|' '{print $3}' | tr -d ' '
          }

          PACKAGE_CHANGES=""
          packages=("Ubuntu" "ffmpeg for homebridge" "Homebridge APT Package" "NodeJS" "Homebridge UI" "Homebridge")

          for package in "${packages[@]}"; do
            current_version=$(extract_package_version "$CURRENT_MANIFEST" "$package")
            prev_version=$(extract_package_version "$PREV_MANIFEST" "$package")
            if [[ "$current_version" != "$prev_version" && -n "$current_version" && -n "$prev_version" ]]; then
              [[ -n "$PACKAGE_CHANGES" ]] && PACKAGE_CHANGES="$PACKAGE_CHANGES\n"
              PACKAGE_CHANGES="${PACKAGE_CHANGES}• **$package**: $prev_version → $current_version"
            fi
          done

          [[ -z "$PACKAGE_CHANGES" ]] && PACKAGE_CHANGES="• No package version changes detected"
        else
          PACKAGE_CHANGES="• Initial release - no previous version to compare"
        fi

        {
          echo 'package_changes<<EOF'
          echo -e "$PACKAGE_CHANGES"
          echo 'EOF'
        } >> $GITHUB_OUTPUT

    - name: Upload outputs as artifacts
      uses: actions/upload-artifact@v7
      with:
        name: output
        path: output/*

  create-release:
    runs-on: ubuntu-latest
    needs: [set-versions, extract-manifest, build-images]
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        name: output
        path: output

    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ needs.set-versions.outputs.DOCKER_HOMEBRIDGE_VERSION }}" \
          --title "${{ needs.set-versions.outputs.RELEASE_TITLE }}" \
          --notes-file output/release-body.md \
          --draft=false

    - name: Upload Release Assets
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload "${{ needs.set-versions.outputs.DOCKER_HOMEBRIDGE_VERSION }}" "output/Docker.manifest" --clobber

    - name: Release created
      run: |
        echo "::notice::Release ${{ needs.set-versions.outputs.DOCKER_HOMEBRIDGE_VERSION }} - ${{ needs.set-versions.outputs.RELEASE_TITLE }} created successfully."

  discord-notification:
    name: Discord Webhooks
    needs: [set-versions, create-release, extract-manifest]
    if: ${{ inputs.release_type == 'stable' }}
    uses: homebridge/.github/.github/workflows/discord-webhooks.yml@latest
    with:
      title: "${{ needs.set-versions.outputs.RELEASE_TITLE }}"
      description: |
        Version `${{ needs.set-versions.outputs.DOCKER_HOMEBRIDGE_VERSION }}`
        url: "https://github.com/homebridge/docker-homebridge/releases/tag/${{ needs.set-versions.outputs.DOCKER_HOMEBRIDGE_VERSION }}"

        **Package Changes:**
        ${{ needs.extract-manifest.outputs.package_changes }}
    secrets:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL_LATEST }}

  validate-container:
    name: Validate Docker Container
    needs: [set-versions, create-release]
    uses: ./.github/workflows/validate-docker-container.yml
    with:
      release_tag: ${{ needs.set-versions.outputs.DOCKER_TAG }}

  stable-release-is-latest:
    needs: [create-release, set-versions]
    if: ${{ inputs.release_type == 'stable' }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Mark Stable Release as Non-Prerelease and Latest
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release edit ${{ needs.set-versions.outputs.DOCKER_HOMEBRIDGE_VERSION }} \
          --prerelease=false \
          --latest