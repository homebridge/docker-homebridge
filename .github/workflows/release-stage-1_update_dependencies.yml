name: Dependency Management - Update and Build
run-name: Dependency Management - ${{ github.event_name == 'workflow_dispatch' && format('Manual - {0}', github.event.inputs.release_stream) || 'Scheduled' }} Run

on:
  schedule:
    # Daily updates - 6 AM Eastern (10 AM UTC), processes stable, beta and alpha streams
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      release_stream:
        description: 'Choose release stream to update and build'
        required: true
        type: choice
        options:
          - stable
          - beta
          - alpha
          - all
        default: all
      skip_build:
        description: 'Skip build and only update dependencies'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  define-matrix:
    name: Define Jobs Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set matrix based on trigger
        id: set-matrix
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.release_stream }}" == "all" ]]; then
              echo 'matrix={"stream":["stable","beta","alpha"]}' >> $GITHUB_OUTPUT
            else
              echo "matrix={\"stream\":[\"${{ github.event.inputs.release_stream }}\"]}" >> $GITHUB_OUTPUT
            fi
          else
            # Scheduled run - process stable, beta, and alpha streams
            echo 'matrix={"stream":["stable","beta","alpha"]}' >> $GITHUB_OUTPUT
          fi

      - name: Output matrix for debugging
        run: |
          echo "::notice::Dependencies Matrix: ${{ steps.set-matrix.outputs.matrix }}"

  update-dependencies:
    name: Update ${{ matrix.stream }} Dependencies
    needs: define-matrix
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        stream: ${{ fromJson(needs.define-matrix.outputs.matrix).stream }}
    outputs:
      stable_changes: ${{ steps.set-outputs.outputs.stable_changes }}
      beta_changes: ${{ steps.set-outputs.outputs.beta_changes }}
      alpha_changes: ${{ steps.set-outputs.outputs.alpha_changes }}
    steps:
      - name: Update Dependencies
        id: dependency-bot
        uses: NorthernMan54/Homebridge-Dependency-Bot@latest
        with:
          config_file: '.github/homebridge-dependency-bot-${{ matrix.stream }}.json'
          release_stream: ${{ matrix.stream }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Set outputs for build triggers
        id: set-outputs
        run: |
          echo "${{ matrix.stream }}_changes=${{ steps.dependency-bot.outputs.changes_detected }}" >> $GITHUB_OUTPUT

  build-trigger-matrix:
    name: Build Trigger Matrix
    needs: update-dependencies
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      build: ${{ steps.set-matrix.outputs.build }}
    steps:
      - name: Set build trigger matrix
        id: set-matrix
        run: |
          BUILD=""
          MATRIX_ENTRIES=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.skip_build }}" == "true" ]]; then
            echo 'matrix={"stream":[]}' >> $GITHUB_OUTPUT
            exit 0
          fi

          if [[ "${{ needs.update-dependencies.outputs.stable_changes }}" == "true" ]]; then
            MATRIX_ENTRIES+=('"stable"')
            BUILD="true"
          fi
          if [[ "${{ needs.update-dependencies.outputs.beta_changes }}" == "true" ]]; then
            MATRIX_ENTRIES+=('"beta"')
            BUILD="true"
          fi
          if [[ "${{ needs.update-dependencies.outputs.alpha_changes }}" == "true" ]]; then
            MATRIX_ENTRIES+=('"alpha"')
            BUILD="true"
          fi

          if [ ${#MATRIX_ENTRIES[@]} -eq 0 ]; then
            echo 'matrix={"stream":[]}' >> $GITHUB_OUTPUT
            echo "build=false" >> $GITHUB_OUTPUT
          else
            MATRIX_JSON=$(printf '%s,' "${MATRIX_ENTRIES[@]}")
            MATRIX_JSON="[${MATRIX_JSON%,}]"
            echo "{\"stream\":$MATRIX_JSON}" | jq -c . | sed 's/"/\\"/g' | awk '{print "matrix=" $0}' >> $GITHUB_OUTPUT
            echo "build=true" >> $GITHUB_OUTPUT
          fi
      - name: Output matrix for debugging
        run: |
          echo "::notice::Build Trigger Matrix: ${{ steps.set-matrix.outputs.build }} - ${{ steps.set-matrix.outputs.matrix }}"

  trigger-builds-notice:
    name: Notify No Builds Triggered
    needs: [update-dependencies, build-trigger-matrix]
    if: ${{ needs.build-trigger-matrix.outputs.build == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: No builds to trigger
        run: |
          echo "::warning::No dependency updates detected or build skipped. No builds to trigger."

  trigger-builds:
    name: Trigger ${{ matrix.stream }} Build
    needs: [update-dependencies, build-trigger-matrix]
    if: ${{ needs.build-trigger-matrix.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        stream: ${{ fromJson(needs.build-trigger-matrix.outputs.matrix).stream }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Trigger Build and Release
        run: |
          echo "::notice::Triggering ${{ matrix.stream }} build - Build and Push Docker Images"
          gh workflow run release-stage-2_build_and_push_docker_images.yml --ref latest --field release_type=${{ matrix.stream }} || { 
            echo "::error::Failed to trigger ${{ matrix.stream }} build workflow"; 
            exit 1; 
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}