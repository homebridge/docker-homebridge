name: Release Stage 1 - Dependency Management - Update and Build
run-name: Release Stage 1 - Dependency Management - ${{ github.event_name == 'workflow_dispatch' && format('Manual - {0}', github.event.inputs.release_stream) || 'Scheduled' }} Run

on:
  schedule:
    # Daily updates - 6 AM Eastern (10 AM UTC), processes stable, beta and alpha streams
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      release_stream:
        description: 'Choose release stream to update and build'
        required: true
        type: choice
        options:
          - stable
          - beta
          - alpha
          - legacy
          - synology
          - all
        default: all
      skip_build:
        description: 'Skip build and only update dependencies'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-stage-1-update-dependencies
  cancel-in-progress: false
  
# No job gets a token with rights by default. Each job below lists what it needs.
permissions: {}

jobs:
  define-matrix:
    name: Define Jobs Matrix
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set matrix based on trigger
        id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_STREAM: ${{ github.event.inputs.release_stream }}
        run: |
          # A scheduled run and "all" process every stream
          MATRIX='{"stream":["stable","beta","alpha","legacy","synology"]}'
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$RELEASE_STREAM" != "all" ]]; then
            MATRIX=$(jq -cn --arg stream "$RELEASE_STREAM" '{stream: [$stream]}')
          fi
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "::notice::Dependencies Matrix: ${MATRIX}"

  update-dependencies:
    name: Update ${{ matrix.stream }} Dependencies
    needs: define-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write # delete old releases and their tags
      actions: write # start the Stage 2 workflow
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        stream: ${{ fromJson(needs.define-matrix.outputs.matrix).stream }}
    steps:
      - name: Checkout the workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Beta and alpha build from the newest <stream>-YYYY.M.D branch when one exists
      # (e.g. beta-2026.11.18), so unreleased features can ship to that stream without
      # touching latest. Every other stream, and beta/alpha without such a branch, uses latest.
      # The script warns when such a branch is missing changes that are on latest.
      - name: Resolve ${{ matrix.stream }} Branch
        id: resolve-branch
        env:
          GH_TOKEN: ${{ github.token }}
          STREAM: ${{ matrix.stream }}
        run: .github/scripts/resolve-stream-branch.sh "$STREAM"

      - name: Create Dependency Bot App Token
        id: dependency-bot-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.DEPENDENCY_BOT_APP_ID }}
          private-key: ${{ secrets.DEPENDENCY_BOT_PRIVATE_KEY }}
          owner: homebridge
          repositories: docker-homebridge
          permission-contents: write

      - name: Update Dependencies ${{ matrix.stream }}
        id: homebridge-bot
        uses: homebridge/dependency-bot@latest
        with:
          config_file: '.github/homebridge-dependency-bot-${{ matrix.stream }}.json'
          release_stream: ${{ matrix.stream }}
          base_branch: ${{ steps.resolve-branch.outputs.branch }}
          # GitHub App on latest's bypass list, for direct pushes. Every stream uses
          # "update_method": "push", so the bot needs no other token.
          PUBLISH_TOKEN: ${{ steps.dependency-bot-token.outputs.token }}

      - name: Log Skipped ${{ matrix.stream }} Stage 2 Trigger
        if: steps.homebridge-bot.outputs.changes_detected != 'true' || steps.homebridge-bot.outputs.auto_merge != 'true'
        run: |
          echo "::warning::${{ matrix.stream }} Stage 2 not triggered: Changes Detected=${{ steps.homebridge-bot.outputs.changes_detected }}, Auto Merge=${{ steps.homebridge-bot.outputs.auto_merge }}"
  
      - name: Checkout repository (for trigger step)
        if: steps.homebridge-bot.outputs.changes_detected == 'true' && steps.homebridge-bot.outputs.auto_merge == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trigger and Wait for ${{ matrix.stream }} Stage 2 Workflow
        if: steps.homebridge-bot.outputs.changes_detected == 'true' && steps.homebridge-bot.outputs.auto_merge == 'true'
        uses: ./.github/actions/trigger-and-wait-workflow
        with:
          workflow-file: 'release-stage-2_build_and_push_docker_images.yml'
          ref: ${{ steps.resolve-branch.outputs.branch }}
          release-type: ${{ matrix.stream }}
          scheduled: ${{ github.event_name == 'workflow_dispatch' && 'Manual' || 'Scheduled' }}
          github-token: ${{ github.token }}
          # Stage 2 builds, tests on two CPU types and only then publishes
          timeout-minutes: '90'
          run-name: ${{ github.event_name == 'workflow_dispatch' && 'Manual' || 'Scheduled' }} - Build and Push ${{ matrix.stream }}

      - name: Cleanup older beta and alpha release and tags
        if: ${{ matrix.stream != 'stable' }}
        uses: ./.github/actions/cleanup-old-releases-and-tags
        with:
          github-token: ${{ github.token }}
          release-type: ${{ matrix.stream }}
          releases-to-keep: 5