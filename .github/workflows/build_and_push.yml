name: Build and Push Docker Images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Triggers a beta release of the Homebridge Docker image. The image will be built using versions from beta/package.json and tagged with "beta" and "beta-YYYY-MM-DD" (e.g., beta-2025-06-17). Images will be pushed to ghcr.io/homebridge/homebridge and, if configured, homebridge/homebridge on Docker Hub.'
        required: false
        default: 'info'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Get branch/tag name
      id: get_branch
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          export BRANCH_NAME="beta-$(date +%Y-%m-%d)"
        else
          export BRANCH_NAME=$(echo "${{ github.ref }}" | sed -e "s/refs\/heads\///g" -e "s/refs\/tags\///g")
        fi
        echo $BRANCH_NAME
        echo "BRANCH_NAME=${BRANCH_NAME}" >> $GITHUB_OUTPUT

    - name: Set image tag
      id: image_tag
      run: |
        export IMAGE_TAG=$(if [[ "${{ steps.get_branch.outputs.BRANCH_NAME }}" =~ (latest|master|main) ]]; then echo "latest"; else echo "${{ steps.get_branch.outputs.BRANCH_NAME }}"; fi)
        echo $IMAGE_TAG
        echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_OUTPUT

    - name: Set alternate image tag
      id: alt_image_tag
      run: |
        export ALT_IMAGE_TAG=$(if [[ "${{ steps.get_branch.outputs.BRANCH_NAME }}" =~ (latest|master|main) ]]; then echo "ubuntu"; else echo "${{ steps.get_branch.outputs.BRANCH_NAME }}-ubuntu"; fi)
        echo $ALT_IMAGE_TAG
        echo "ALT_IMAGE_TAG=${ALT_IMAGE_TAG}" >> $GITHUB_OUTPUT

    - name: Set versioned image tag
      id: versioned_image_tag
      run: |
        export FORMATED_DATE=`date +%Y-%m-%d`
        export VERSION_IMAGE_TAG=$(if [[ "${{ steps.get_branch.outputs.BRANCH_NAME }}" =~ (latest|master|main) ]]; then echo ${FORMATED_DATE}; else echo "${{ steps.get_branch.outputs.BRANCH_NAME }}-${FORMATED_DATE}"; fi)
        echo $VERSION_IMAGE_TAG
        echo "VERSION_IMAGE_TAG=${VERSION_IMAGE_TAG}" >> $GITHUB_OUTPUT

    - name: Check for beta release
      id: check_beta
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          if [[ -f beta/package.json ]]; then
            echo "IS_BETA=true" >> $GITHUB_OUTPUT
          else
            echo "Error: beta/package.json is missing for beta release"
            exit 1
          fi
        else
          echo "IS_BETA=false" >> $GITHUB_OUTPUT
        fi

    - name: Set Package Versions
      id: pkg_version
      run: |
        if [[ "${{ steps.check_beta.outputs.IS_BETA }}" == "true" ]]; then
          export HOMEBRIDGE_APT_PKG_VERSION=$(jq -r '.dependencies["@homebridge/homebridge-apt-pkg"]' beta/package.json | sed 's/\^//')
          export FFMPEG_FOR_HOMEBRIDGE_VERSION=$(jq -r '.dependencies["ffmpeg-for-homebridge"]' beta/package.json | sed 's/\^//')
        else
          export HOMEBRIDGE_APT_PKG_VERSION=$(jq -r '.dependencies["@homebridge/homebridge-apt-pkg"]' package.json | sed 's/\^//')
          export FFMPEG_FOR_HOMEBRIDGE_VERSION=$(jq -r '.dependencies["ffmpeg-for-homebridge"]' package.json | sed 's/\^//')
        fi
        export DOCKER_HOMEBRIDGE_VERSION=${{ steps.image_tag.outputs.IMAGE_TAG }}
        echo "HOMEBRIDGE_APT_PKG_VERSION=v${HOMEBRIDGE_APT_PKG_VERSION}" >> $GITHUB_OUTPUT
        echo "FFMPEG_FOR_HOMEBRIDGE_VERSION=v${FFMPEG_FOR_HOMEBRIDGE_VERSION}" >> $GITHUB_OUTPUT
        echo "DOCKER_HOMEBRIDGE_VERSION=${DOCKER_HOMEBRIDGE_VERSION}" >> $GITHUB_OUTPUT

    - name: Log into GitHub Container registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Image to GitHub Container Registry (Stable)
      if: steps.check_beta.outputs.IS_BETA == 'false'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm/v7,linux/arm64
        push: true
        build-args: |
          HOMEBRIDGE_APT_PKG_VERSION=${{ steps.pkg_version.outputs.HOMEBRIDGE_APT_PKG_VERSION }}
          FFMPEG_FOR_HOMEBRIDGE_VERSION=${{ steps.pkg_version.outputs.FFMPEG_FOR_HOMEBRIDGE_VERSION }}
          DOCKER_HOMEBRIDGE_VERSION=${{ steps.image_tag.outputs.IMAGE_TAG }}
        tags: |
          ghcr.io/homebridge/homebridge:latest
          ghcr.io/homebridge/homebridge:ubuntu
          ghcr.io/homebridge/homebridge:${{ steps.image_tag.outputs.IMAGE_TAG }}

    - name: Build and Push Image to GitHub Container Registry (Beta)
      if: steps.check_beta.outputs.IS_BETA == 'true'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm/v7,linux/arm64
        push: true
        build-args: |
          HOMEBRIDGE_APT_PKG_VERSION=${{ steps.pkg_version.outputs.HOMEBRIDGE_APT_PKG_VERSION }}
          FFMPEG_FOR_HOMEBRIDGE_VERSION=${{ steps.pkg_version.outputs.FFMPEG_FOR_HOMEBRIDGE_VERSION }}
          DOCKER_HOMEBRIDGE_VERSION=${{ steps.image_tag.outputs.IMAGE_TAG }}
        tags: |
          ghcr.io/homebridge/homebridge:beta
          ghcr.io/homebridge/homebridge:${{ steps.image_tag.outputs.IMAGE_TAG }}

    - name: Log into Docker Hub
      uses: docker/login-action@v3
      if: github.repository == 'homebridge/docker-homebridge'
      with:
        registry: docker.io
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Image to Docker Hub (Stable)
      if: github.repository == 'homebridge/docker-homebridge' && steps.check_beta.outputs.IS_BETA == 'false'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm/v7,linux/arm64
        push: true
        build-args: |
          HOMEBRIDGE_APT_PKG_VERSION=${{ steps.pkg_version.outputs.HOMEBRIDGE_APT_PKG_VERSION }}
          FFMPEG_FOR_HOMEBRIDGE_VERSION=${{ steps.pkg_version.outputs.FFMPEG_FOR_HOMEBRIDGE_VERSION }}
          DOCKER_HOMEBRIDGE_VERSION=${{ steps.image_tag.outputs.IMAGE_TAG }}
        tags: |
          homebridge/homebridge:latest
          homebridge/homebridge:ubuntu
          homebridge/homebridge:${{ steps.image_tag.outputs.IMAGE_TAG }}

    - name: Build and Push Image to Docker Hub (Beta)
      if: github.repository == 'homebridge/docker-homebridge' && steps.check_beta.outputs.IS_BETA == 'true'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm/v7,linux/arm64
        push: true
        build-args: |
          HOMEBRIDGE_APT_PKG_VERSION=${{ steps.pkg_version.outputs.HOMEBRIDGE_APT_PKG_VERSION }}
          FFMPEG_FOR_HOMEBRIDGE_VERSION=${{ steps.pkg_version.outputs.FFMPEG_FOR_HOMEBRIDGE_VERSION }}
          DOCKER_HOMEBRIDGE_VERSION=${{ steps.image_tag.outputs.IMAGE_TAG }}
        tags: |
          homebridge/homebridge:beta
          homebridge/homebridge:${{ steps.image_tag.outputs.IMAGE_TAG }}

    - name: Send Discord Notification
      uses: appleboy/discord-action@master
      with:
        webhook_id: ${{ secrets.DISCORD_WEBHOOK_ID }}
        webhook_token: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
        message: |
          **Homebridge Docker Release**
          Version: ${{ github.event_name == 'workflow_dispatch' && format('beta-{0}', steps.versioned_image_tag.outputs.VERSION_IMAGE_TAG) || github.event.release.tag_name }}
          [View Release](https://github.com/homebridge/docker-homebridge/releases/tag/${{ github.event_name == 'workflow_dispatch' && format('beta-{0}', steps.versioned_image_tag.outputs.VERSION_IMAGE_TAG) || github.event.release.tag_name }})

  tag:
    name: Verify Release Tag
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Get Release Tag
        id: get_version
        uses: jannemattila/get-version-from-tag@v3
      - name: Tag Info
        run: |
          echo "Release Tag: ${{github.ref}}"
          echo "Latest Tag: ${{ steps.get_version.outputs.version }}"
      - name: Tag Info Matches
        if: endsWith(github.ref, steps.get_version.outputs.version )
        run: |
          echo Latest Tag matches Release tag
      - name: Tag Info Doesn't Match
        if: ${{ !endsWith(github.ref, steps.get_version.outputs.version ) }}
        run: |
          echo Latest Tag does not matches Release tag
          exit 1  
      - name: Published
        run: echo "::notice::GitHub Release - https://github.com/homebridge/docker-homebridge/releases/tag/${{ github.event.release.tag_name }}"