name: Build and Push Docker Images

run-name: Build and Push Docker Images (${{ inputs.release_type == 'stable' && 'latest' || format('beta-{0}', github.event.workflow_run.created_at || 'YYYY-MM-DD') }})

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Choose release type: "stable" (builds latest version) or "beta" (builds beta version with beta-YYYY-MM-DD tag).'
        required: true
        type: choice
        options:
          - stable
          - beta

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Set Docker Homebridge version
      id: docker_version
      run: |
        if [[ "${{ inputs.release_type }}" == "beta" ]]; then
          export DOCKER_HOMEBRIDGE_VERSION="beta-$(date +%Y-%m-%d)"
        else
          export DOCKER_HOMEBRIDGE_VERSION="latest"
        fi
        echo "DOCKER_HOMEBRIDGE_VERSION=${DOCKER_HOMEBRIDGE_VERSION}" >> $GITHUB_OUTPUT

    - name: Check for beta release
      id: check_beta
      run: |
        if [[ "${{ inputs.release_type }}" == "beta" ]]; then
          if [[ -f beta/package.json ]]; then
            echo "IS_BETA=true" >> $GITHUB_OUTPUT
          else
            echo "Error: beta/package.json is missing for beta release"
            exit 1
          fi
        else
          echo "IS_BETA=false" >> $GITHUB_OUTPUT
        fi

    - name: Set Package Versions
      id: pkg_version
      run: |
        if [[ "${{ steps.check_beta.outputs.IS_BETA }}" == "true" ]]; then
          export HOMEBRIDGE_APT_PKG_VERSION=$(jq -r '.dependencies["@homebridge/homebridge-apt-pkg"]' beta/package.json | sed 's/\^//')
          export HOMEBRIDGE_APT_PKG_FILE=$(echo "$HOMEBRIDGE_APT_PKG_VERSION" | sed 's/\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)-beta\(\.[0-9][0-9]*\)/\1.beta\2/')
          export FFMPEG_FOR_HOMEBRIDGE_VERSION=$(jq -r '.dependencies["ffmpeg-for-homebridge"]' beta/package.json | sed 's/\^//')
          echo "HOMEBRIDGE_APT_PKG_FILE=${HOMEBRIDGE_APT_PKG_FILE}" >> $GITHUB_OUTPUT
        else
          export HOMEBRIDGE_APT_PKG_VERSION=$(jq -r '.dependencies["@homebridge/homebridge-apt-pkg"]' package.json | sed 's/\^//')
          export FFMPEG_FOR_HOMEBRIDGE_VERSION=$(jq -r '.dependencies["ffmpeg-for-homebridge"]' package.json | sed 's/\^//')
        fi
        echo "HOMEBRIDGE_APT_PKG_VERSION=v${HOMEBRIDGE_APT_PKG_VERSION}" >> $GITHUB_OUTPUT
        echo "FFMPEG_FOR_HOMEBRIDGE_VERSION=v${FFMPEG_FOR_HOMEBRIDGE_VERSION}" >> $GITHUB_OUTPUT
        echo "DOCKER_HOMEBRIDGE_VERSION=${{ steps.docker_version.outputs.DOCKER_HOMEBRIDGE_VERSION }}" >> $GITHUB_OUTPUT

    - name: Log into GitHub Container registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Image to GitHub Container Registry (Stable)
      if: steps.check_beta.outputs.IS_BETA == 'false'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm/v7,linux/arm64
        push: true
        build-args: |
          HOMEBRIDGE_APT_PKG_VERSION=${{ steps.pkg_version.outputs.HOMEBRIDGE_APT_PKG_VERSION }}
          FFMPEG_FOR_HOMEBRIDGE_VERSION=${{ steps.pkg_version.outputs.FFMPEG_FOR_HOMEBRIDGE_VERSION }}
          DOCKER_HOMEBRIDGE_VERSION=${{ steps.docker_version.outputs.DOCKER_HOMEBRIDGE_VERSION }}
        tags: |
          ghcr.io/homebridge/homebridge:latest
          ghcr.io/homebridge/homebridge:ubuntu
          ghcr.io/homebridge/homebridge:${{ steps.docker_version.outputs.DOCKER_HOMEBRIDGE_VERSION }}

    - name: Build and Push Image to GitHub Container Registry (Beta)
      if: steps.check_beta.outputs.IS_BETA == 'true'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm/v7,linux/arm64
        push: true
        build-args: |
          HOMEBRIDGE_APT_PKG_VERSION=${{ steps.pkg_version.outputs.HOMEBRIDGE_APT_PKG_VERSION }}
          HOMEBRIDGE_APT_PKG_FILE=${{ steps.pkg_version.outputs.HOMEBRIDGE_APT_PKG_FILE }}
          FFMPEG_FOR_HOMEBRIDGE_VERSION=${{ steps.pkg_version.outputs.FFMPEG_FOR_HOMEBRIDGE_VERSION }}
          DOCKER_HOMEBRIDGE_VERSION=${{ steps.docker_version.outputs.DOCKER_HOMEBRIDGE_VERSION }}
        tags: |
          ghcr.io/homebridge/homebridge:beta
          ghcr.io/homebridge/homebridge:${{ steps.docker_version.outputs.DOCKER_HOMEBRIDGE_VERSION }}

    - name: Log into Docker Hub
      uses: docker/login-action@v3
      if: github.repository == 'homebridge/docker-homebridge'
      with:
        registry: docker.io
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Image to Docker Hub (Stable)
      if: github.repository == 'homebridge/docker-homebridge' && steps.check_beta.outputs.IS_BETA == 'false'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm/v7,linux/arm64
        push: true
        build-args: |
          HOMEBRIDGE_APT_PKG_VERSION=${{ steps.pkg_version.outputs.HOMEBRIDGE_APT_PKG_VERSION }}
          FFMPEG_FOR_HOMEBRIDGE_VERSION=${{ steps.pkg_version.outputs.FFMPEG_FOR_HOMEBRIDGE_VERSION }}
          DOCKER_HOMEBRIDGE_VERSION=${{ steps.docker_version.outputs.DOCKER_HOMEBRIDGE_VERSION }}
        tags: |
          homebridge/homebridge:latest
          homebridge/homebridge:ubuntu
          homebridge/homebridge:${{ steps.docker_version.outputs.DOCKER_HOMEBRIDGE_VERSION }}

    - name: Build and Push Image to Docker Hub (Beta)
      if: github.repository == 'homebridge/docker-homebridge' && steps.check_beta.outputs.IS_BETA == 'true'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm/v7,linux/arm64
        push: true
        build-args: |
          HOMEBRIDGE_APT_PKG_VERSION=${{ steps.pkg_version.outputs.HOMEBRIDGE_APT_PKG_VERSION }}
          HOMEBRIDGE_APT_PKG_FILE=${{ steps.pkg_version.outputs.HOMEBRIDGE_APT_PKG_FILE }}
          FFMPEG_FOR_HOMEBRIDGE_VERSION=${{ steps.pkg_version.outputs.FFMPEG_FOR_HOMEBRIDGE_VERSION }}
          DOCKER_HOMEBRIDGE_VERSION=${{ steps.docker_version.outputs.DOCKER_HOMEBRIDGE_VERSION }}
        tags: |
          homebridge/homebridge:beta
          homebridge/homebridge:${{ steps.docker_version.outputs.DOCKER_HOMEBRIDGE_VERSION }}

    - name: Extract Docker.manifest from Image
      run: |
        if [[ "${{ steps.check_beta.outputs.IS_BETA }}" == "true" ]]; then
          docker pull ghcr.io/homebridge/homebridge:${{ steps.docker_version.outputs.DOCKER_HOMEBRIDGE_VERSION }}
          docker run --rm ghcr.io/homebridge/homebridge:${{ steps.docker_version.outputs.DOCKER_HOMEBRIDGE_VERSION }} cat /opt/homebridge/Docker.manifest > manifest.md
        else
          docker pull ghcr.io/homebridge/homebridge:latest
          docker run --rm ghcr.io/homebridge/homebridge:latest cat /opt/homebridge/Docker.manifest > manifest.md
        fi

    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG_NAME=${{ steps.docker_version.outputs.DOCKER_HOMEBRIDGE_VERSION }}
        gh release create "${TAG_NAME}" \
          --title "Homebridge Docker Release ${TAG_NAME}" \
          --notes-file manifest.md \
          --draft=false

    - name: Send Discord Notification
      uses: appleboy/discord-action@master
      with:
        webhook_id: ${{ secrets.DISCORD_WEBHOOK_ID }}
        webhook_token: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
        message: |
          **Homebridge Docker Release**
          Version: ${{ steps.docker_version.outputs.DOCKER_HOMEBRIDGE_VERSION }}
          [View Release](https://github.com/homebridge/docker-homebridge/releases/tag/${{ steps.docker_version.outputs.DOCKER_HOMEBRIDGE_VERSION }})