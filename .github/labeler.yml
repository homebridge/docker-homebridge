# Labels a pull request by the branch it is opened against.
# Each value is a regular expression that is searched for in the branch name.

# 'beta' for a base branch with "beta" in its name (for example beta-2026.11.18)
beta:
 - base-branch: 'beta'

# 'alpha' for a base branch with "alpha" in its name
alpha:
 - base-branch: 'alpha'

# 'latest' for the base branch latest
latest:
 - base-branch: 'latest'
