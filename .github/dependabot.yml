# Who updates what:
# - The package versions in package.json and <stream>/package.json: homebridge/dependency-bot
#   (config in .github/homebridge-dependency-bot-*.json, run by the Stage 1 workflow)
# - The Docker base image: the "docker.baseImage" field in those same files, changed by hand
# - GitHub Actions in the workflows: Dependabot (configured below)

version: 2
updates:
  # Docker base image updates
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      time: "10:00"
    open-pull-requests-limit: 3
    labels:
      - "production"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
    # Create PRs for out-of-date actions
    open-pull-requests-limit: 10
    target-branch: "latest"
    # Add labels to PRs
    labels:
      - "dependencies"
    # Group related updates together (optional)
    groups:
      actions:
        patterns:
          - "*"
    # Automatically rebase PRs when conflicts occur
    rebase-strategy: "auto"
    # Commit message prefix
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"