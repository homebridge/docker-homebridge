name: 'Trigger and Wait for Workflow'
description: 'Triggers a workflow and waits for its completion. Fails when the triggered run fails, is cancelled or takes too long.'
inputs:
  workflow-file:
    description: 'The workflow file to trigger (e.g., release-stage-2_build_and_push_docker_images.yml)'
    required: true
  ref:
    description: 'The git ref to run the workflow on'
    required: true
    default: 'latest'
  release-type:
    description: 'The release type parameter to pass to the workflow'
    required: true
  scheduled:
    description: 'The scheduled parameter to pass to the workflow'
    required: false
    default: 'Manual'
  github-token:
    description: 'GitHub token for authentication (needs actions: write)'
    required: true
  timeout-minutes:
    description: 'Maximum wait time in minutes'
    required: false
    default: '30'
  run-name:
    description: 'Text that the name of the triggered workflow run contains'
    required: false
    default: ''

outputs:
  workflow-conclusion:
    description: 'The conclusion of the triggered workflow'
    value: ${{ steps.wait-completion.outputs.conclusion }}
  run-id:
    description: 'The run ID of the triggered workflow'
    value: ${{ steps.find-workflow.outputs.run_id }}

runs:
  using: 'composite'
  steps:
    - name: Trigger ${{ inputs.release-type }} Workflow
      id: trigger
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        WORKFLOW_FILE: ${{ inputs.workflow-file }}
        REF: ${{ inputs.ref }}
        RELEASE_TYPE: ${{ inputs.release-type }}
        SCHEDULED: ${{ inputs.scheduled }}
      run: |
        echo "::notice::Triggering ${RELEASE_TYPE} workflow - ${WORKFLOW_FILE}"

        # Remember the newest run that exists now. The run we start below gets a higher id.
        LAST_RUN_ID=$(gh run list --workflow "$WORKFLOW_FILE" --limit 1 --json databaseId --jq '.[0].databaseId // 0')
        echo "last_run_id=${LAST_RUN_ID:-0}" >> "$GITHUB_OUTPUT"

        gh workflow run "$WORKFLOW_FILE" \
          --ref "$REF" \
          --field release_type="$RELEASE_TYPE" \
          --field Scheduled="$SCHEDULED" || {
          echo "::error::Failed to trigger ${RELEASE_TYPE} workflow"
          exit 1
        }

        echo "::notice::${RELEASE_TYPE} workflow triggered successfully"

    - name: Find ${{ inputs.run-name }} Workflow Run
      id: find-workflow
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        WORKFLOW_FILE: ${{ inputs.workflow-file }}
        REF: ${{ inputs.ref }}
        RUN_NAME: ${{ inputs.run-name }}
        LAST_RUN_ID: ${{ steps.trigger.outputs.last_run_id }}
      run: |
        RUN_ID=$("${GITHUB_ACTION_PATH}/find-run.sh" "$WORKFLOW_FILE" "$REF" "$RUN_NAME" "$LAST_RUN_ID")
        echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"

    - name: Wait for ${{ inputs.release-type }} Workflow Completion
      id: wait-completion
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        RUN_ID: ${{ steps.find-workflow.outputs.run_id }}
        RELEASE_TYPE: ${{ inputs.release-type }}
        TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
      run: |
        "${GITHUB_ACTION_PATH}/wait-for-run.sh" "$RUN_ID" "$RELEASE_TYPE" "$TIMEOUT_MINUTES"
