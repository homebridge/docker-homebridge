name: "Cleanup Old Releases and Tags"
description: "Deletes older releases and tags for a given release type, keeping only the latest N."
inputs:
  github-token:
    description: "GitHub token that may delete releases and tags (contents: write)"
    required: true
  release-type:
    description: "Release type (stable, beta, alpha, legacy or synology)"
    required: true
  releases-to-keep:
    description: "Number of releases to keep"
    required: true
runs:
  using: "composite"
  steps:
    - name: Delete Old Releases and Tags
      if: ${{ inputs.release-type != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        RELEASE_TYPE: ${{ inputs.release-type }}
        RELEASES_TO_KEEP: ${{ inputs.releases-to-keep }}
      run: |
        "${GITHUB_ACTION_PATH}/cleanup.sh" "$RELEASE_TYPE" "$RELEASES_TO_KEEP"
