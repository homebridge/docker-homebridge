services:
  homebridge:
    image: ${HOMEBRIDGE_IMAGE:-homebridge/homebridge:beta}
    hostname: test-homebridge-docker
    restart: always
    network_mode: host
    volumes:
      - ./volumes/homebridge:/homebridge
      - /var/run/dbus:/var/run/dbus  # Mount host D-Bus socket
      - /var/run/avahi-daemon/socket:/var/run/avahi-daemon/socket  # Mount avahi socket
    environment:
      - TZ=America/Toronto
      - ENABLE_AVAHI=0      # Optional: Enable/disable Avahi (1=enabled, 0=disabled)
      - ENABLE_HOSTNAME_PUBLISH=1  # Optional: Enable/disable hostname publisher (1=enabled, 0=disabled)
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '1'
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8581 || exit 1"]
      interval: 60s
      retries: 5
      start_period: 300s
      timeout: 2s