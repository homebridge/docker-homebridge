services:
  homebridge:
    image: ${HOMEBRIDGE_IMAGE:-homebridge/homebridge:beta}
    hostname: test-homebridge-docker
    restart: always
    network_mode: host
    volumes:
      - ./volumes/homebridge:/homebridge
    environment:
      - TZ=America/Toronto
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '1'
